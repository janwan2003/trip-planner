<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeGoWhen — Find the dates everyone is free for a group trip</title>
    <meta name="description" content="Share one link, everyone taps the days they are free, and WeGoWhen ranks the date ranges that fit the most people. No account, no sign-up." />
    <meta name="author" content="WeGoWhen" />
    <meta name="keywords" content="wegowhen, group trip planner, group availability calendar, when2meet alternative, multi-day date poll, group trip dates, travel planning" />

    <!-- Open Graph / Facebook / WhatsApp / iMessage -->
    <meta property="og:site_name" content="WeGoWhen" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="WeGoWhen — Find the dates everyone can go" />
    <meta property="og:description" content="Everyone taps the days they are free. WeGoWhen ranks the date ranges that fit the most people. No account, no sign-up." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wegowhen.com/" />
    <meta property="og:image" content="https://wegowhen.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="WeGoWhen: a month of days heat-mapped by how many people are free, with a four-day run everyone can make." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WeGoWhen — Find the dates everyone can go" />
    <meta name="twitter:description" content="Everyone taps the days they are free. WeGoWhen ranks the date ranges that fit the most people. No account, no sign-up." />
    <meta name="twitter:image" content="https://wegowhen.com/og-image.png" />
    <meta name="twitter:image:alt" content="WeGoWhen: a month of days heat-mapped by how many people are free, with a four-day run everyone can make." />

    <!-- Theme color -->
    <meta name="theme-color" content="#e67e4f" />

    <!-- Canonical -->
    <link rel="canonical" href="https://wegowhen.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!--
      Structured data. Kept in the static HTML rather than injected by React so a
      crawler that does not execute JavaScript still sees it. Deliberately no
      aggregateRating: the product has no reviews, and inventing them would be a
      fabrication as well as a structured-data violation.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "WeGoWhen",
        "url": "https://wegowhen.com/",
        "description": "WeGoWhen finds the days a group can travel together. Everyone marks the days they are free on a shared calendar, and WeGoWhen ranks the consecutive date ranges that fit the most people.",
        "applicationCategory": "TravelApplication",
        "applicationSubCategory": "Group trip date planning",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript.",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Share one link, no account or email needed",
          "Mark availability by tapping or dragging across days",
          "Heat map showing how many people are free on each day",
          "Ranked list of consecutive date ranges that fit the most people",
          "Filter participants to test smaller groups"
        ],
        "screenshot": "https://wegowhen.com/og-image.png"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!--
      Reciprocal launch-directory badges, deliberately OUTSIDE #root.

      OpenHunts and Fazier give a free listing in exchange for a visible link
      back, and both verify it by fetching this page's HTML - not by running the
      app. Rendered from React they were invisible to that check: `curl` found
      zero badge references while a headless browser found them, which is
      exactly what a verifier sees. React only replaces #root, so anything here
      survives hydration and is in the served bytes.
    -->
    <footer class="launch-badges" aria-label="Launch platforms">
      <a href="https://openhunts.com" target="_blank" rel="noopener noreferrer">
        <img src="https://cdn.openhunts.com/badges/club.webp" alt="OpenHunts" width="486" height="105" loading="lazy" />
      </a>
      <a href="https://fazier.com" target="_blank" rel="noopener noreferrer">
        <img src="https://fazier.com/api/v1/public/badges/launch_badges.svg" alt="Fazier" width="182" height="43" loading="lazy" />
      </a>
    </footer>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
