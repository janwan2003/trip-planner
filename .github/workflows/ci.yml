name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Node 22 matches what Cloudflare Pages builds with, so a green CI means
      # the same toolchain that produces production also passed here.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run test:coverage

      # Build before the API tests, because Pages serves dist alongside the Functions.
      - run: pnpm run build

      # Integration tests boot a real `wrangler pages dev` with a local D1 and hit the
      # API over HTTP. They are out of the default test run because booting workerd
      # takes seconds; they belong in CI, where that cost is worth paying.
      - run: pnpm exec vitest run --config vitest.integration.config.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
